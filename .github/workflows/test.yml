name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: fedora:45
    
    env:
      RAMS_TEST_CBC: true
      RAMS_TEST_CLP: true
      RAMS_TEST_GLPK: true
      RAMS_TEST_HIGHS: true
      RAMS_TEST_SCIP: true

    steps:
    - uses: actions/checkout@v7
    
    - name: Install system dependencies
      run: |
        dnf update -y
        dnf install -y ruby ruby-devel rubygem-bundler gcc gcc-c++ make redhat-rpm-config
    
    - name: Set up Ruby environment
      run: |
        ruby -v
        bundle -v
        bundle install
    
    - name: Install optimization solvers
      run: |
        dnf install -y coin-or-Cbc coin-or-Clp coin-or-HiGHS glpk-utils scip
    
    - name: Run tests
      run: bundle exec rake test
